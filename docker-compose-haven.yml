services:
  containrbot:
    image: containrbot
    build:
      context: .
      dockerfile: containrbot/Dockerfile
    ports:
      - "8081:8080"
    environment:
      CHATBOT: haven
      CONTAINRBOTAPI_BASEURL: "http://containrbotapi:8080/"
      CHAT_SERVICE_URL: "https://for-testing-change.me"
    secrets:
      - bot-token
      #- bot-webhook-secret
  containrbotapi:
    image: containrbotapi
    build:
      context: .
      dockerfile: containrbotapi/Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      ORCHESTRATOR: docker
      CONTAINER_LIST: "[{\"FriendlyName\": \"hello\", \"ContainerName\": \"hello-world\", \"Namespace\": \"\"}]"
      
  hello-world:
    container_name: hello-world
    image: nginx

secrets:
  bot-token:
    file: ./containrbot/local-only/secrets/bot-token.txt
  #bot-webhook-secret:
  #  file: ./containrbot/local-only/secrets/bot-webhook-secret.txt